# First and subsequent npm publications of @bounded-authority-protocol/verifier.
# Publishing is bound to THIS repository's workflow identity: npm trusted
# publishing (GitHub Actions OIDC, no long-lived token) plus npm provenance,
# per the ADR 0008/0015 provenance discipline the SDK inherits. The trusted
# publisher registered on npm names exactly this repository and this workflow
# file; a publish attempted anywhere else fails.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify then publish to npm (provenance-bound)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node (24 bundles npm >= 11.5 — required for OIDC trusted publishing)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Full verification gate (typecheck, lint, license, unit, permissiveness, both conformance corpora)
        run: |
          pnpm typecheck && pnpm lint && pnpm license-check && pnpm test && \
          pnpm test:permissiveness && pnpm conformance && pnpm conformance:v2

      # Idempotent releases: a version already on the registry (e.g. seeded from
      # the repository checkout under the owner's session, as 0.1.0 and the 0.2.0
      # rename seed were) verifies only — the full matrix above still gates the tag.
      - name: Check registry for existing version
        id: existing
        run: |
          if npm view "@bounded-authority-protocol/verifier@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing: npm exchanges this workflow's OIDC token for a
      # one-time publish grant. No NPM_TOKEN secret exists anywhere.
      - name: Publish to npm with provenance
        if: steps.existing.outputs.published == 'false'
        run: npm publish --provenance
