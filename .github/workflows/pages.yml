# GitHub Pages publishes the verifier bench and versioned API reference from this
# repository's development verifier source plus the published signer package (demo
# issuance only); no backend, no secrets, deploy-only permissions.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    timeout-minutes: 5 # Run 44039148515: green build job 27s.
    name: Build the bench bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse a ref outside the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "::error::Publication requires the default branch"; exit 1; }
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - name: Refuse a different Node version
        run: |
          expected="$(awk '$1 == "nodejs" {print $2}' .tool-versions)"
          test "$(node --version)" = "v$expected" || { echo "::error::Node must be exactly $expected"; exit 1; }

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck the site
        run: pnpm typecheck:web

      - name: Build the bundle
        run: pnpm build:site

      - name: Build /api/ from the release tag matching npm latest
        run: pnpm docs:api:release

      - name: Every built-site version claim must match npm latest
        run: pnpm check:site

      - name: Scan the bench bundle (no unresolved globals, eval or Function constructor)
        run: node tools/browser-guard.mjs --scan site-dist/app.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@0252fc4ba7626f0298f0cf00902a25c6afc77fa8 # v3.0.0
        with:
          path: site-dist

  deploy:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    timeout-minutes: 5 # Run 44039148515: green deploy job 10s.
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a ref outside the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "::error::Publication requires the default branch"; exit 1; }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@7a9bd943aa5e5175aeb8502edcc6c1c02d398e10 # v4.0.2
