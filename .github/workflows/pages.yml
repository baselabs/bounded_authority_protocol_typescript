# GitHub Pages publishes the verifier bench and versioned API reference from this
# repository's development verifier source plus the published signer package (demo
# issuance only); no backend, no secrets, deploy-only permissions.
name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "src/**", "docs/**", "README.md", "typedoc.json", "tsconfig*.json", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tools/build-release-api.mjs", "tools/check-pages-release.mjs", "tools/check-site-badge.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # npm approval is external to GitHub and can happen after Release succeeds.
  # Rebuild only when the published latest differs from the deployed API manifest.
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publication:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      rebuild: ${{ steps.publication.outputs.rebuild }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Compare published npm latest with the deployed API
        id: publication
        run: node tools/check-pages-release.mjs

  build:
    needs: publication
    if: ${{ !cancelled() && (needs.publication.result == 'skipped' || (needs.publication.result == 'success' && needs.publication.outputs.rebuild == 'true')) }}
    name: Build the bench bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1 # lockstep with .tool-versions (the family asdf pin)
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck the site
        run: pnpm typecheck:web

      - name: Build the bundle
        run: pnpm build:site

      - name: Build /api/ from the release tag matching npm latest
        run: pnpm docs:api:release

      - name: Every built-site version claim must match npm latest
        run: pnpm check:site

      - name: Scan the bench bundle (no unresolved globals, eval or Function constructor)
        run: node tools/browser-guard.mjs --scan site-dist/app.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@0252fc4ba7626f0298f0cf00902a25c6afc77fa8 # v3.0.0
        with:
          path: site-dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@7a9bd943aa5e5175aeb8502edcc6c1c02d398e10 # v4.0.2
