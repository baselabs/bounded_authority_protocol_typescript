name: CI

on:
  push:
    branches: ['kci/**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    timeout-minutes: 5 # Run 44123105381: slowest green lane 9s.
    name: secret scan (full history and sensitivity)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read exact Python pin
        id: pins
        run: scripts/tool-versions.sh read python
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Refuse a different Python version
        run: scripts/tool-versions.sh check python
      - name: Install verified Gitleaks 8.30.1
        run: |
          scripts/install_gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Verify scanner sensitivity and checksum rejection
        run: |
          scripts/install_gitleaks.sh --check
          scripts/secret_scan.sh --check
      - name: Scan merge-aware history
        run: scripts/secret_scan.sh --history

  corpus-artifact:
    timeout-minutes: 5 # Run 44123105381: slowest green lane 18s.
    name: vendored corpus equals its certified artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: scripts/tool-versions.sh read nodejs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.nodejs }}
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          pnpm_version=$(pnpm --version)
          test "pnpm@$pnpm_version" = "$manager"
      - name: Refuse a different Node version
        run: scripts/tool-versions.sh check nodejs
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # Check the pinned artifact, not freshness. Hex outages and retirement fail closed.
      - name: Fetch, verify both Hex checksums, and compare the whole tree both ways
        run: node scripts/check-corpus.mjs ci --main

  verify:
    timeout-minutes: 6 # Run 44312164032: slowest green lane 160s; twice that.
    name: typecheck, lint, license, unit, conformance (contract majors, sibling profiles, strict Ed25519, producer canonicality, selector float-zero; node and portable backends) on Node line ${{ matrix.node-line }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # The two exact Node pins on the .tool-versions nodejs line: the primary version and the
        # compatibility lane, both read by scripts/tool-versions.sh. Verdicts must be identical on both: the strict
        # Ed25519 rule gates every verify before the backend, so a backend that differs by version
        # (the platform OpenSSL) cannot change a verdict.
        node-line: [nodejs, nodejs-next]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: scripts/tool-versions.sh read nodejs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs[matrix.node-line] }}
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          pnpm_version=$(pnpm --version)
          test "pnpm@$pnpm_version" = "$manager"
      - name: Refuse a different Node version
        env:
          NODE_LANE: ${{ matrix.node-line == 'nodejs-next' && 'next' || 'primary' }}
        run: scripts/tool-versions.sh check nodejs "$NODE_LANE"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check complete snapshot and documentation offline
        run: pnpm check:corpus

      - name: Normative specification anchors (fail closed)
        run: pnpm test:network

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Build versioned API reference (warnings are errors)
        run: pnpm docs:api

      - name: Browser typecheck (src/ and the browser lane page, DOM + ES2022, no ambient types)
        run: pnpm typecheck:browser

      - name: Lint (incl. library-path purity and browser-safety rules)
        run: pnpm lint

      - name: Browser bundle guard (portable backend only; no unresolved globals, eval or Function constructor)
        run: pnpm guard:browser

      - name: Browser bundle size within budget (tools/bundle-size-budget.json)
        run: pnpm size

      - name: License check (the three @noble runtime dependencies and their transitive ones)
        run: pnpm license-check

      - name: Unit + struct + facade corpus-vector tests
        run: pnpm test

      - name: Permissiveness mutation-gate
        run: pnpm test:permissiveness

      - name: Check conformance for vendored v1 snapshot
        run: pnpm conformance

      - name: Check conformance for vendored v2 snapshot
        run: pnpm conformance:v2

      - name: Check conformance for vendored v3 snapshot
        run: pnpm conformance:v3

      - name: Check conformance for vendored role-attestation profile snapshot
        run: pnpm conformance:role-attestation

      - name: Check conformance for vendored content-assertion profile snapshot
        run: pnpm conformance:content-assertion

      - name: Check conformance for vendored strict Ed25519 snapshot
        run: pnpm conformance:strict-ed25519

      - name: Check conformance for vendored local-loopback HTTP profile snapshot
        run: pnpm conformance:local-loopback-http

      - name: Check conformance for vendored producer-canonicality snapshot
        run: pnpm conformance:producer-canonicality

      - name: Check conformance for vendored selector-float-zero snapshot
        run: pnpm conformance:selector-float-zero

      - name: Unit + permissiveness under the portable backend (--conditions=bap-portable)
        run: pnpm test:portable

      - name: Check conformance for every corpus under the portable backend (verdict digests equal the node backend's)
        run: pnpm conformance:portable

  runtimes:
    timeout-minutes: 5 # Run 44123105381: slowest green lane 32s.
    # Deno and Bun resolve the package's "#crypto" import under their own conditions (deno, bun) to the
    # portable backend; each lane asserts BACKEND_ID first, then every corpus's verdicts against the pins
    # and against Node case by case.
    name: conformance lane on ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, bun]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: scripts/tool-versions.sh read nodejs deno bun

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.nodejs }}
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          pnpm_version=$(pnpm --version)
          test "pnpm@$pnpm_version" = "$manager"
      - name: Refuse a different Node version
        run: scripts/tool-versions.sh check nodejs

      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.pins.outputs.deno }}

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.pins.outputs.bun }}

      - name: Refuse a different runtime version
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: scripts/tool-versions.sh check "$RUNTIME"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check complete snapshot and documentation offline
        run: pnpm check:corpus

      - name: Conformance lane (builds first)
        env:
          BAP_RUNTIMES: ${{ matrix.runtime }}
        run: pnpm test:runtimes

  package:
    timeout-minutes: 5 # Run 44123105381: slowest green lane 108s.
    # The packed tarball as a consumer receives it: typecheck with skipLibCheck false under each
    # resolution, lib and condition set, the leaked-type red-proof, and the installed package run on
    # Node (both backends), Deno and Bun, including the closed deep-import surface (every deep path refuses).
    name: packed tarball (consumer typecheck and runtimes)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: scripts/tool-versions.sh read nodejs deno bun

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.nodejs }}
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          pnpm_version=$(pnpm --version)
          test "pnpm@$pnpm_version" = "$manager"
      - name: Refuse a different Node version
        run: scripts/tool-versions.sh check nodejs

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.pins.outputs.deno }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.pins.outputs.bun }}

      - name: Refuse different runtime versions
        run: |
          scripts/tool-versions.sh check deno
          scripts/tool-versions.sh check bun

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check complete snapshot and documentation offline
        run: pnpm check:corpus

      - name: Packed tarball checks (builds first)
        run: pnpm test:tarball

  browser-conformance:
    timeout-minutes: 5 # Run 44211491286: slowest green lane 73s in the pinned Playwright image.
    # Real engines through Playwright under the strict CSP (an engine axis, not an OS axis: Linux only).
    # Linux WebKit is evidence for this pure-JS verifier only, never for Safari.
    name: browser conformance lane on ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --init --ipc=host
    env:
      HOME: /root # Firefox requires the current user's home in a root container.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The container runs as root on a workspace the runner user owns; git refuses it otherwise.
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: scripts/tool-versions.sh read nodejs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.nodejs }}
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          pnpm_version=$(pnpm --version)
          test "pnpm@$pnpm_version" = "$manager"
      - name: Refuse a different Node version
        run: scripts/tool-versions.sh check nodejs

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Refuse a different Playwright version
        run: |
          expected="1.65.1"
          actual="$(node -p 'require("playwright/package.json").version')"
          test "$actual" = "$expected" || { echo "::error::Installed Playwright $actual differs from container image Playwright $expected; update the lockfile and image together"; exit 1; }

      - name: Check complete snapshot and documentation offline
        run: pnpm check:corpus

      - name: Browser conformance lane (builds first)
        env:
          BAP_BROWSERS: ${{ matrix.engine }}
        run: pnpm test:browser

  supply-chain:
    timeout-minutes: 5 # Run 44123105381: slowest green lane 26s.
    # Registry signatures and provenance attestations of every installed package (CI and release).
    # Runs on the Node compatibility lane: npm 10 (Node 22) does not apply package.json overrides
    # through pnpm's linked packages, so it looks up this unpublished version; npm 11.18 and later do.
    name: npm audit signatures
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: scripts/tool-versions.sh read nodejs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs['nodejs-next'] }}
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          pnpm_version=$(pnpm --version)
          test "pnpm@$pnpm_version" = "$manager"
      - name: Refuse a different Node version
        run: scripts/tool-versions.sh check nodejs next

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit dependency advisories
        run: pnpm audit --audit-level=high

      - name: Verify registry signatures and attestations
        run: npm audit signatures

  dependency-currency:
    timeout-minutes: 5 # Run 44123105381: slowest green lane 20s.
    # Verify latest-first dependency currency. A property of the
    # manifest + lockfile, so it is proven once per run, not once per OS lane.
    name: dependency currency (latest-first)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: scripts/tool-versions.sh read nodejs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.nodejs }}
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          pnpm_version=$(pnpm --version)
          test "pnpm@$pnpm_version" = "$manager"
      - name: Refuse a different Node version
        run: scripts/tool-versions.sh check nodejs

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Dependency currency (classified exit; unverified never passes)
        run: node tools/check-currency.mjs

  site:
    timeout-minutes: 5 # Pages run 44039148515: green build job 27s.
    # Qualify the complete Pages pipeline from a frozen install, before any library build.
    name: Pages build and checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: scripts/tool-versions.sh read nodejs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.nodejs }}
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          pnpm_version=$(pnpm --version)
          test "pnpm@$pnpm_version" = "$manager"
      - name: Refuse a different Node version
        run: scripts/tool-versions.sh check nodejs

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build and check the complete Pages site
        run: pnpm site

  notebooks-local:
    timeout-minutes: 5 # Run 44312164032: green job 34s.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact notebook toolchain and frozen dependencies
        uses: ./.github/actions/notebook-tools
      # deno fmt --check misreports notebooks on a cold cache; compare the formatted bytes.
      - name: Refuse unformatted notebook cells
        run: |
          deno fmt docs/notebooks/*.ipynb
          git diff --exit-code -- docs/notebooks
      - name: Execute notebooks against the inspected packed candidate
        run: pnpm notebooks:local

  durable-replay:
    timeout-minutes: 5 # Run 44312164032: green job 20s.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: scripts/tool-versions.sh read nodejs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.nodejs }}
          package-manager-cache: false
      - name: Activate declared pnpm and refuse a different Node
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          pnpm_version=$(pnpm --version)
          test "pnpm@$pnpm_version" = "$manager"
          scripts/tool-versions.sh check nodejs
      - name: Install JavaScript dependencies frozen
        run: pnpm install --frozen-lockfile
      - name: Real SQLite contention and process restart
        run: pnpm test:docs-replay

  qualified:
    if: always()
    needs: [secrets, corpus-artifact, verify, runtimes, package, browser-conformance, supply-chain, dependency-currency, site, notebooks-local, durable-replay]
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 44312164032: green job 18s.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read exact Python pin
        id: pins
        run: scripts/tool-versions.sh read python
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Refuse a different Python version
        run: scripts/tool-versions.sh check python
      - name: Require every qualification job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['NEEDS_JSON'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Qualification failed: {failed}')
          PYTHON
