name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:

  # Nightly currency meter (latest-first, BAP ADR-0032 shape): paths-ignore
  # applies only to push/pull_request events, so a scheduled run executes the
  # full workflow (verify + dependency-currency) regardless of what last
  # touched the tree. Upstream drift reddens the badge AT the drift within a
  # day, not at the next innocent push. 08:23 UTC daily (~04:23 US Eastern),
  # off the :00 high-delay minute.
  schedule:
    - cron: "23 8 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, license, unit, conformance (contract majors, sibling profiles, census)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1 # lockstep with .tool-versions (the family asdf pin)
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Lint (incl. library-path purity rule)
        run: pnpm lint

      - name: License check (zero runtime deps expected)
        run: pnpm license-check

      - name: Unit + struct + facade corpus-vector tests
        run: pnpm test

      - name: Permissiveness mutation-gate
        run: pnpm test:permissiveness

      - name: Conformance — vendored v1 snapshot (283 + two-boundary census)
        run: pnpm conformance

      - name: Conformance — vendored v2 snapshot (268 + curated census)
        run: pnpm conformance:v2

      - name: Conformance — vendored v3 snapshot (292 + curated census)
        run: pnpm conformance:v3

      - name: Conformance — vendored role-attestation profile snapshot (40 + cross-profile)
        run: pnpm conformance:role-attestation

      - name: Conformance — vendored content-assertion profile snapshot
        run: pnpm conformance:content-assertion

  dependency-currency:
    # Latest-first dependency currency (BAP ADR 0032 shape). A property of the
    # manifest + lockfile, so it is proven once per run, not once per OS lane.
    name: dependency currency (latest-first)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1 # lockstep with .tool-versions (the family asdf pin)
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Dependency currency (classified exit; unverified never passes)
        run: node tools/check-currency.mjs
