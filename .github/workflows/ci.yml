name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:

  # Nightly currency meter (latest-first, BAP ADR-0032 shape): paths-ignore
  # applies only to push/pull_request events, so a scheduled run executes the
  # full workflow (verify + dependency-currency) regardless of what last
  # touched the tree. Upstream drift reddens the badge AT the drift within a
  # day, not at the next innocent push. 08:23 UTC daily (~04:23 US Eastern),
  # off the :00 high-delay minute.
  schedule:
    - cron: "23 8 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, license, unit, conformance (contract majors, sibling profiles, strict Ed25519, census; node and portable backends) on Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # Two pinned Node lines, both exact: 22.23.1 (lockstep with .tool-versions, the family asdf pin)
        # and 24.19.0 (the release lane, release.yml). Verdicts must be identical on both: the strict
        # Ed25519 rule gates every verify before the backend, so a backend that differs by version
        # (the platform OpenSSL) cannot change a verdict.
        node: [22.23.1, 24.19.0]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }} # exact pins: 22.23.1 (.tool-versions lockstep) and 24.19.0 (release lane)
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Browser typecheck (src/ and the browser lane page, DOM + ES2022, no ambient types)
        run: pnpm typecheck:browser

      - name: Lint (incl. library-path purity and browser-safety rules)
        run: pnpm lint

      - name: Browser bundle guard (portable backend only; no unresolved globals, eval or Function constructor)
        run: pnpm guard:browser

      - name: License check (the three @noble runtime dependencies and their transitive ones)
        run: pnpm license-check

      - name: Unit + struct + facade corpus-vector tests
        run: pnpm test

      - name: Permissiveness mutation-gate
        run: pnpm test:permissiveness

      - name: Conformance — vendored v1 snapshot (283 + two-boundary census)
        run: pnpm conformance

      - name: Conformance — vendored v2 snapshot (268 + curated census)
        run: pnpm conformance:v2

      - name: Conformance — vendored v3 snapshot (292 + curated census)
        run: pnpm conformance:v3

      - name: Conformance — vendored role-attestation profile snapshot (40 + cross-profile)
        run: pnpm conformance:role-attestation

      - name: Conformance — vendored content-assertion profile snapshot
        run: pnpm conformance:content-assertion

      - name: Conformance — vendored strict Ed25519 snapshot (2410, additive to the corpora above)
        run: pnpm conformance:strict-ed25519

      - name: Conformance — vendored local-loopback HTTP profile snapshot (44)
        run: pnpm conformance:local-loopback-http

      - name: Unit + permissiveness under the portable backend (--conditions=bap-portable)
        run: pnpm test:portable

      - name: Conformance — every corpus under the portable backend (verdict digests equal the node backend's)
        run: pnpm conformance:portable

  runtimes:
    # Deno and Bun resolve the package's "#crypto" import under their own conditions (deno, bun) to the
    # portable backend; each lane asserts BACKEND_ID first, then every corpus's verdicts against the pins
    # and against Node case by case.
    name: conformance lane on ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, bun]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1 # lockstep with .tool-versions (the family asdf pin)
          cache: pnpm

      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.5.6

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Conformance lane (builds first)
        env:
          BAP_RUNTIMES: ${{ matrix.runtime }}
        run: pnpm test:runtimes

  package:
    # The packed tarball as a consumer receives it: typecheck with skipLibCheck false under each
    # resolution, lib and condition set, the leaked-type red-proof, and the installed package run on
    # Node (both backends), Deno and Bun, including the "./*" deep-import passthrough.
    name: packed tarball (consumer typecheck and runtimes)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1 # lockstep with .tool-versions (the family asdf pin)
          cache: pnpm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.5.6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Packed tarball checks (builds first)
        run: pnpm test:tarball

  browser-conformance:
    # Real engines through Playwright under the strict CSP (an engine axis, not an OS axis: Linux only).
    # Linux WebKit is evidence for this pure-JS verifier only, never for Safari.
    name: browser conformance lane on ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1 # lockstep with .tool-versions (the family asdf pin)
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install the ${{ matrix.engine }} build pinned by the locked Playwright
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}

      - name: Browser conformance lane (builds first)
        env:
          BAP_BROWSERS: ${{ matrix.engine }}
        run: pnpm test:browser

  supply-chain:
    # Registry signatures and provenance attestations of every installed package (CI and release).
    name: npm audit signatures
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1 # lockstep with .tool-versions (the family asdf pin)
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify registry signatures and attestations
        run: npm audit signatures

  dependency-currency:
    # Latest-first dependency currency (BAP ADR 0032 shape). A property of the
    # manifest + lockfile, so it is proven once per run, not once per OS lane.
    name: dependency currency (latest-first)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1 # lockstep with .tool-versions (the family asdf pin)
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Dependency currency (classified exit; unverified never passes)
        run: node tools/check-currency.mjs
