name: Adopt certified corpus

on:
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: corpus-adoption
  cancel-in-progress: false

jobs:
  adopt:
    timeout-minutes: 5 # no green run yet
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          test "pnpm@$(pnpm --version)" = "$manager"
      - name: Refuse a different Node version
        run: |
          expected="$(awk '$1 == "nodejs" {print $2}' .tool-versions)"
          test "$(node --version)" = "v$expected" || { echo "::error::Node must be exactly $expected"; exit 1; }
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Fetch the newest eligible release
        run: node scripts/check-corpus.mjs adopt
      - name: Push adoption branch and maintain its landing issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          if git diff --quiet -- conformance/SOURCE; then exit 0; fi
          version=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("conformance/SOURCE")).version)')
          branch="automation/adopt-corpus-$version"
          title="Adopt certified Hex corpus $version"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            # Refuse an existing branch whose adopted bytes or generated summary differ.
            git diff --exit-code FETCH_HEAD -- conformance/SOURCE conformance/priv/conformance README.md
            sha=$(git rev-parse FETCH_HEAD)
          else
            git switch -c "$branch"
            git add -- conformance/SOURCE conformance/priv/conformance README.md
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Adopt certified Hex corpus $version"
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --set-upstream origin "$branch"
            sha=$(git rev-parse HEAD)
          fi
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          cat > "$body" <<TEXT
          Adopt the complete priv/conformance subtree from Hex bounded_authority_protocol $version.

          Branch: $branch
          Compare: https://github.com/$GH_REPO/compare/main...$branch
          Commit: $sha

          Vendoring verified both Hex checksums. Offline conformance checks self-consistency against SOURCE, including its complete-tree digest; corpus-artifact fetches and compares the named Hex release. A Hex outage or retirement fails that job closed. Infra reviews the branch and qualifies and lands the commit with kimosabe-land --repo . --sha $sha; its kci/ push is the only qualification run.
          TEXT
          # Paginate all issues, including closed ones; exact title equality provides deduplication.
          issue=$(gh api --paginate "repos/$GH_REPO/issues?state=all&per_page=100" --jq ".[] | select(.pull_request == null and .title == \"$title\") | .number" | sed -n '1p')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body"
          fi
