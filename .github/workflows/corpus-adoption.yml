name: Adopt certified corpus

on:
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: corpus-adoption
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Fetch the newest eligible release
        run: node scripts/check-corpus.mjs adopt
      - name: Open an adoption PR when SOURCE changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          if git diff --quiet -- conformance/SOURCE; then exit 0; fi
          version=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("conformance/SOURCE")).version)')
          branch="automation/adopt-corpus-$version"
          existing=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then echo "$existing"; exit 0; fi
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git switch -c "$branch"
            git add -- conformance/SOURCE conformance/priv/conformance
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Adopt certified Hex corpus $version"
            git push --set-upstream origin "$branch"
          fi
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          cat > "$body" <<TEXT
          Adopt the complete priv/conformance subtree certified by bounded_authority_protocol $version on Hex. Both archive checksums and all nine index pins were verified before the transactional replacement.

          CI checks every file against the named artifact and recomputes every verdict offline. Review and merge this adoption before the next npm release.
          TEXT
          gh pr create --base main --head "$branch" --title "Adopt certified Hex corpus $version" --body-file "$body"
