name: Adopt certified corpus

on:
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: corpus-adoption
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Fetch the newest eligible release
        run: node scripts/check-corpus.mjs adopt
      - name: Push adoption branch, dispatch CI, and maintain its issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          if git diff --quiet -- conformance/SOURCE; then exit 0; fi
          version=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("conformance/SOURCE")).version)')
          branch="automation/adopt-corpus-$version"
          title="Adopt certified Hex corpus $version"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            # Refuse an existing branch whose adopted bytes or generated summary differ.
            git diff --exit-code FETCH_HEAD -- conformance/SOURCE conformance/priv/conformance README.md
            sha=$(git rev-parse FETCH_HEAD)
          else
            git switch -c "$branch"
            git add -- conformance/SOURCE conformance/priv/conformance README.md
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Adopt certified Hex corpus $version"
            git push --set-upstream origin "$branch"
            sha=$(git rev-parse HEAD)
          fi
          # GITHUB_TOKEN pushes do not start CI. Dispatch explicitly; no PR permission is needed.
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run ci.yml --ref "$branch"
          run_url=""
          for attempt in {1..12}; do
            run_url=$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch --commit "$sha" --created ">=$dispatched_at" --limit 1 --json url --jq '.[0].url // empty')
            if [ -n "$run_url" ]; then break; fi
            echo "Waiting for dispatched CI run (attempt $attempt)"
            sleep 5
          done
          if [ -z "$run_url" ]; then echo "Dispatched CI run did not become visible" >&2; exit 1; fi
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          cat > "$body" <<TEXT
          Adopt the complete priv/conformance subtree from Hex bounded_authority_protocol $version.

          Branch: $branch
          Compare: https://github.com/$GH_REPO/compare/main...$branch
          Dispatched CI: $run_url

          Vendoring verified both Hex checksums. Offline conformance checks self-consistency against SOURCE, including its complete-tree digest; corpus-artifact fetches and compares the named Hex release. A Hex outage or retirement fails that job closed. Review the branch and its CI results before opening a PR targeting main.
          TEXT
          # Paginate all issues, including closed ones; exact title equality provides deduplication.
          issue=$(gh api --paginate "repos/$GH_REPO/issues?state=all&per_page=100" --jq ".[] | select(.pull_request == null and .title == \"$title\") | .number" | sed -n '1p')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body"
          fi
