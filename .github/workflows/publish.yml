name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the inspected archive with provenance
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 12 # the read-back's 600 s approval deadline and 30 s tarball read, plus 2x the other steps' 29 s; green 3.1 min, run 44623496542.
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse a ref outside the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "::error::Publication requires the default branch"; exit 1; }
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read exact runtime pins
        id: pins
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"
      - name: Set up Node from the tool versions
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.nodejs }}
          package-manager-cache: false
      - name: Refuse a different Node version
        run: scripts/toolchain.sh --installed nodejs=${{ steps.pins.outputs.nodejs }}
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          pnpm_version=$(pnpm --version)
          test "pnpm@$pnpm_version" = "$manager"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
          check-latest: false
          allow-prereleases: false
      - name: Refuse a different Python version
        run: scripts/toolchain.sh --installed python=${{ steps.pins.outputs.python }}
      - name: Pin archive tooling
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Install with the frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Refuse a package name the registry has never had
        run: |
          node --input-type=module <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const {name} = JSON.parse(readFileSync('package.json', 'utf8'));
          let packageResponse;
          try {
            packageResponse = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}`, {signal: AbortSignal.timeout(30_000)});
          } catch {
            throw new Error(`npm registry could not be read for ${name}`);
          }
          assert.notEqual(packageResponse.status, 404, `${name} has never been published to npm: this workflow publishes new versions of existing packages only. A first publication is the owner's decision.`);
          assert.equal(packageResponse.status, 200, `npm registry could not be read for ${name} (HTTP ${packageResponse.status})`);
          JAVASCRIPT
      - name: Refuse a tagged version
        run: |
          node --input-type=module <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const {version} = JSON.parse(readFileSync('package.json', 'utf8'));
          const tags = execFileSync('git', ['ls-remote', '--tags', 'origin', `refs/tags/v${version}`, `refs/tags/v${version}^{}`], {encoding: 'utf8'});
          assert.equal(tags.trim(), '', `v${version} is already tagged`);
          JAVASCRIPT
      - name: Refuse a stale corpus before publication
        run: pnpm check:corpus:release
      - name: Build the library and documentation
        run: |
          pnpm build
          pnpm docs:api
      - name: Pack the package archive
        run: |
          mkdir -p artifacts
          node tools/pack.mjs --out artifacts > artifacts/pack.json
      - name: Inspect the exact package archive
        id: inspect
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, tarfile
          from pathlib import Path, PurePosixPath
          source = json.loads(Path('package.json').read_text())
          metadata = json.loads(Path('artifacts/pack.json').read_text())
          archive = Path('artifacts') / metadata[0]['filename'] if isinstance(metadata, list) else Path(metadata['file'])
          assert archive.resolve().parent == Path('artifacts').resolve(), 'archive must be in artifacts'
          target = Path('artifacts/package.tgz')
          archive.rename(target)
          allowed = set(source['files']) | {'package.json', 'README.md', 'LICENSE', 'NOTICE'}
          with tarfile.open(target, 'r:gz') as package:
              members = package.getmembers()
              paths = set()
              for member in members:
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts, f'unsafe path: {path}'
                  assert path.parts[0] == 'package', f'unexpected archive root: {path}'
                  if member.isdir():
                      continue
                  assert member.isfile(), f'non-regular archive member: {path}'
                  relative = str(path.relative_to('package'))
                  assert relative in allowed or any(relative.startswith(entry.rstrip('/') + '/') for entry in allowed), f'unexpected packed file: {relative}'
                  assert relative not in paths, f'duplicate packed file: {relative}'
                  paths.add(relative)
              packed = json.load(package.extractfile('package/package.json'))
          assert (packed['name'], packed['version']) == (source['name'], source['version']), 'package identity differs'
          assert packed.get('publishConfig', {}).get('access') == 'public', 'package must be public'
          assert {'package.json', 'README.md', 'LICENSE', 'NOTICE'} <= paths, 'required package documents are missing'
          def inspect(value):
              if isinstance(value, dict):
                  for child in value.values():
                      inspect(child)
              elif isinstance(value, list):
                  for child in value:
                      inspect(child)
              elif isinstance(value, str) and value.startswith('./'):
                  assert value[2:] in paths, f'missing exported file: {value}'
          inspect(packed.get('exports', {}))
          inspect(packed.get('imports', {}))
          for field in ('main', 'types'):
              assert packed[field].removeprefix('./') in paths, f'missing {field} entry point'
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          Path('artifacts/SHA256SUMS').write_text(f'{digest}  package.tgz\n')
          print(f"Inspected {packed['name']}@{packed['version']}: {len(paths)} files; SHA-256 {digest}")
          PYTHON
      - name: Verify the inspected archive checksum
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Compare any served version with the inspected archive
        id: registry
        run: |
          python3 - <<'PYTHON'
          import base64, hashlib, json, os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          package = json.loads(Path('package.json').read_text())
          name, version = package['name'], package['version']
          archive = Path('artifacts/package.tgz').read_bytes()
          integrity = 'sha512-' + base64.b64encode(hashlib.sha512(archive).digest()).decode()
          url = 'https://registry.npmjs.org/' + quote(name, safe='') + '/' + quote(version, safe='')
          request = Request(url, headers={'Cache-Control': 'no-cache'})
          try:
              with urlopen(request, timeout=30) as response:
                  release = json.load(response)
          except HTTPError as error:
              if error.code != 404:
                  raise
              stage = True
          else:
              assert (release.get('name'), release.get('version')) == (name, version), 'registry identity differs'
              assert not release.get('deprecated'), f'{name}@{version} is deprecated; refusing publication'
              assert release.get('dist', {}).get('integrity') == integrity, 'served SHA-512 differs from inspected archive'
              stage = False
              print(f'npm already serves the inspected {name}@{version}; skipping staging')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'stage={str(stage).lower()}\n')
          PYTHON
      - name: Stage the inspected archive with trusted publishing
        if: steps.registry.outputs.stage == 'true'
        run: |
          # npm 11.19.0: staged versions share the published-version unique index.
          # OIDC cannot list stages; preserve npm's refusal and never replace one.
          if output="$(npm stage publish ./artifacts/package.tgz --provenance 2>&1)"; then
            printf '%s\n' "$output"
          else
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | grep -Eqi 'already staged|previously staged|staged.*(already|exist)'; then
              echo "::error::Version is already staged, awaiting owner approval on npmjs.com. Approve the existing stage, then dispatch this commit again. Nothing was replaced."
            else
              echo "::error::npm refused staging. Review its error above; an existing stage must be approved on npmjs.com, never replaced or unpublished."
            fi
            exit 1
          fi
      - name: Read back the exact inspected bytes or report pending approval
        env:
          STAGED: ${{ steps.registry.outputs.stage }}
        run: |
          python3 - <<'PYTHON'
          import base64, hashlib, json, os, time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote, urlsplit
          from urllib.request import Request, urlopen
          package = json.loads(Path('package.json').read_text())
          name, version = package['name'], package['version']
          archive = Path('artifacts/package.tgz').read_bytes()
          integrity = 'sha512-' + base64.b64encode(hashlib.sha512(archive).digest()).decode()
          url = 'https://registry.npmjs.org/' + quote(name, safe='') + '/' + quote(version, safe='')
          deadline = time.monotonic() + 600
          while time.monotonic() < deadline:
              request = Request(url, headers={'Cache-Control': 'no-cache'})
              try:
                  with urlopen(request, timeout=max(1, min(30, deadline - time.monotonic()))) as response:
                      release = json.load(response)
              except HTTPError as error:
                  if error.code != 404 or os.environ['STAGED'] != 'true':
                      raise
                  time.sleep(max(0, min(10, deadline - time.monotonic())))
                  continue
              assert (release.get('name'), release.get('version')) == (name, version), 'registry identity differs'
              assert not release.get('deprecated'), f'{name}@{version} is deprecated; refusing publication'
              assert release.get('dist', {}).get('integrity') == integrity, 'served SHA-512 differs from inspected archive'
              tarball = urlsplit(release['dist']['tarball'])
              assert tarball.scheme == 'https' and tarball.netloc == 'registry.npmjs.org', 'unexpected tarball origin'
              request = Request(tarball.geturl(), headers={'Cache-Control': 'no-cache'})
              with urlopen(request, timeout=30) as response:
                  served = response.read()
              assert served == archive, 'registry tarball differs from inspected archive'
              print(f'Read back exact inspected bytes for {name}@{version}; SHA-512 {integrity}')
              break
          else:
              raise SystemExit(f'::error::{name}@{version} staged, awaiting owner approval on npmjs.com. '
                               'Release is incomplete. Approve the existing stage, then dispatch this commit again.')
          PYTHON
      - name: Upload the inspected release assets
        if: ${{ !cancelled() && steps.inspect.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            artifacts/package.tgz
            artifacts/SHA256SUMS
          if-no-files-found: error

  published-notebooks:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # 5-minute floor; green 1.6 min, run 44623496542.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install exact notebook toolchain and frozen dependencies
        uses: ./.github/actions/notebook-tools
      - name: Execute notebooks against the exact npm releases
        run: pnpm notebooks:published
      - name: Run the remaining published documentation checks
        run: pnpm docs:checks:published
