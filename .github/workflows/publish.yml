name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the inspected archive with provenance
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 42807453625: the former publication job took 25s.
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse a ref outside the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "::error::Publication requires the default branch"; exit 1; }
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node from the tool versions
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          test "pnpm@$(pnpm --version)" = "$manager"
      - name: Refuse a different Node version
        run: |
          expected="$(awk '$1 == "nodejs" {print $2}' .tool-versions)"
          test "$(node --version)" = "v$expected" || { echo "::error::Node must be exactly $expected"; exit 1; }
      - name: Pin archive tooling
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Install with the frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Refuse a package name the registry has never had
        run: |
          node --input-type=module <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const {name} = JSON.parse(readFileSync('package.json', 'utf8'));
          let packageResponse;
          try {
            packageResponse = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}`, {signal: AbortSignal.timeout(30_000)});
          } catch {
            throw new Error(`npm registry could not be read for ${name}`);
          }
          assert.notEqual(packageResponse.status, 404, `${name} has never been published to npm: this workflow publishes new versions of existing packages only. A first publication is the owner's decision.`);
          assert.equal(packageResponse.status, 200, `npm registry could not be read for ${name} (HTTP ${packageResponse.status})`);
          JAVASCRIPT
      - name: Refuse a published or tagged version
        run: |
          node --input-type=module <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {execFileSync, spawnSync} from 'node:child_process';
          const {name, version} = JSON.parse(readFileSync('package.json', 'utf8'));
          const result = spawnSync('npm', ['view', `${name}@${version}`, 'version', '--json', '--registry=https://registry.npmjs.org/'], {encoding: 'utf8'});
          assert.notEqual(result.status, 0, `${name}@${version} is already published`);
          assert.equal(JSON.parse(result.stdout).error?.code, 'E404', 'registry lookup failed without confirming an unpublished version');
          const tags = execFileSync('git', ['ls-remote', '--tags', 'origin', `refs/tags/v${version}`, `refs/tags/v${version}^{}`], {encoding: 'utf8'});
          assert.equal(tags.trim(), '', `v${version} is already tagged`);
          JAVASCRIPT
      - name: Refuse a stale corpus before publication
        run: pnpm check:corpus:release
      - name: Build the library and documentation
        run: |
          pnpm build
          pnpm docs:api
      - name: Pack the package archive
        run: |
          mkdir -p artifacts
          node tools/pack.mjs --out artifacts > artifacts/pack.json
      - name: Inspect the exact package archive
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, tarfile
          from pathlib import Path, PurePosixPath
          source = json.loads(Path('package.json').read_text())
          metadata = json.loads(Path('artifacts/pack.json').read_text())
          archive = Path('artifacts') / metadata[0]['filename'] if isinstance(metadata, list) else Path(metadata['file'])
          assert archive.resolve().parent == Path('artifacts').resolve(), 'archive must be in artifacts'
          target = Path('artifacts/package.tgz')
          archive.rename(target)
          allowed = set(source['files']) | {'package.json', 'README.md', 'LICENSE', 'NOTICE'}
          with tarfile.open(target, 'r:gz') as package:
              members = package.getmembers()
              paths = set()
              for member in members:
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts, f'unsafe path: {path}'
                  assert path.parts[0] == 'package', f'unexpected archive root: {path}'
                  if member.isdir():
                      continue
                  assert member.isfile(), f'non-regular archive member: {path}'
                  relative = str(path.relative_to('package'))
                  assert relative in allowed or any(relative.startswith(entry.rstrip('/') + '/') for entry in allowed), f'unexpected packed file: {relative}'
                  assert relative not in paths, f'duplicate packed file: {relative}'
                  paths.add(relative)
              packed = json.load(package.extractfile('package/package.json'))
          assert (packed['name'], packed['version']) == (source['name'], source['version']), 'package identity differs'
          assert packed.get('publishConfig', {}).get('access') == 'public', 'package must be public'
          assert {'package.json', 'README.md', 'LICENSE', 'NOTICE'} <= paths, 'required package documents are missing'
          def inspect(value):
              if isinstance(value, dict):
                  for child in value.values():
                      inspect(child)
              elif isinstance(value, list):
                  for child in value:
                      inspect(child)
              elif isinstance(value, str) and value.startswith('./'):
                  assert value[2:] in paths, f'missing exported file: {value}'
          inspect(packed.get('exports', {}))
          inspect(packed.get('imports', {}))
          for field in ('main', 'types'):
              assert packed[field].removeprefix('./') in paths, f'missing {field} entry point'
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          Path('artifacts/SHA256SUMS').write_text(f'{digest}  package.tgz\n')
          print(f"Inspected {packed['name']}@{packed['version']}: {len(paths)} files; SHA-256 {digest}")
          PYTHON
      - name: Verify the inspected archive checksum
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Stage the inspected archive with trusted publishing
        run: npm stage publish ./artifacts/package.tgz --provenance

  published-notebooks:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install exact notebook toolchain and frozen dependencies
        uses: ./.github/actions/notebook-tools
      - name: Wait for the exact npm release
        run: |
          python - <<'PYTHON'
          import json, time
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          package = json.loads(Path('package.json').read_text())
          name, version = package['name'], package['version']
          url = 'https://registry.npmjs.org/' + quote(name, safe='') + '/' + quote(version, safe='')
          deadline = time.monotonic() + 600
          while time.monotonic() < deadline:
              try:
                  request = Request(url, headers={'Cache-Control': 'no-cache'})
                  with urlopen(request, timeout=max(1, min(30, deadline - time.monotonic()))) as response:
                      release = json.load(response)
                  if (release.get('name'), release.get('version')) == (name, version):
                      print(f'npm serves {name}@{version}')
                      break
              except (OSError, ValueError):
                  pass
              time.sleep(max(0, min(10, deadline - time.monotonic())))
          else:
              raise SystemExit(f'::error::npm did not serve {name}@{version} within ten minutes')
          PYTHON
      - name: Execute notebooks against the exact npm releases
        run: pnpm notebooks:published
      - name: Run the remaining published documentation checks
        run: pnpm docs:checks:published
